name: publicar

# Regenera data/avisos.json desde Gold y publica el sitio en GitHub Pages. Corre cada 30 minutos (10 minutos después de cada
# scoring) y a mano. Necesita el secret BD_STRING_VIS y Pages con la fuente "GitHub Actions".
on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exportar avisos
        env:
          BD_STRING_VIS: ${{ secrets.BD_STRING_VIS }}
        run: python scripts/exportar.py
      - name: Armar el sitio
        run: |
          mkdir _sitio
          cp -r index.html app.js styles.css data _sitio/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _sitio
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
