name: publicar

# Regenera data/avisos.json desde Gold y publica el sitio en GitHub Pages. Corre cada 30 minutos (10 minutos después de cada
# scoring) y a mano. Necesita el secret BD_STRING_VIS y Pages con la fuente "GitHub Actions".
on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exportar avisos
        env:
          BD_STRING_VIS: ${{ secrets.BD_STRING_VIS }}
        run: python scripts/exportar.py
      - name: Armar el sitio
        run: |
          mkdir _sitio
          cp -r index.html app.js styles.css data _sitio/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _sitio
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
