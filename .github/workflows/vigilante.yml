name: vigilante

# Revisa cada hora que Gold se siga reconstruyendo y que el scoring esté al día. Si algo se atrasa, la ejecución queda en
# rojo y GitHub avisa por correo (Settings > Notifications > Actions). Solo lee Gold con el rol del mapa.
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar el pipeline
        env:
          BD_STRING_VIS: ${{ secrets.BD_STRING_VIS }}
        run: python scripts/vigilar.py
